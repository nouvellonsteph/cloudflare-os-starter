<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Sandbox</title>
</head>
<body>
  <header>
    <div><h1>Sandbox</h1><p id="status" role="status">Connecting to Workshop…</p></div>
    <div class="controls">
      <button id="open" class="primary">Open workspace</button>
      <button id="save-stop" disabled>Save and stop</button>
    </div>
  </header>
  <p id="error" role="alert" hidden></p>
  <main>
    <aside aria-label="Workspace files">
      <div class="section-heading"><h2>Files</h2><button id="refresh" disabled>Refresh</button></div>
      <nav id="tree" aria-label="File tree"><p class="empty">Open the workspace to browse /workspace.</p></nav>
      <div class="controls file-controls">
        <button id="new-file" disabled>New file</button>
        <button id="new-folder" disabled>New folder</button>
        <button id="upload" disabled>Upload</button>
        <input id="file-input" type="file" hidden>
      </div>
    </aside>
    <div id="workbench">
      <section class="panel editor-panel" aria-label="File editor">
        <div class="section-heading">
          <h2 id="filename">Editor</h2>
          <div class="controls">
            <button id="copy-file" disabled>Copy file</button>
            <button id="rename" disabled>Rename</button>
            <button id="delete" disabled>Delete</button>
            <button id="save-file" class="primary" disabled>Save file</button>
          </div>
        </div>
        <p id="editor-message" class="empty">Select a file from the tree.</p>
        <textarea id="editor" aria-label="File contents" spellcheck="false" hidden></textarea>
      </section>
      <section class="panel terminal-panel" aria-label="Linux terminal">
        <div class="section-heading">
          <h2>Terminal</h2>
          <div class="controls">
            <button id="attach" disabled>Open terminal</button>
            <button id="close-terminal" disabled>End terminal</button>
          </div>
        </div>
        <div id="terminal"></div>
      </section>
    </div>
  </main>
  <dialog id="file-dialog">
    <div class="dialog-content">
      <h2 id="dialog-title"></h2>
      <p id="dialog-message"></p>
      <label id="name-label">Name<input id="entry-name" required maxlength="255" autocomplete="off"></label>
      <div class="controls">
        <button id="cancel" type="button">Cancel</button>
        <button id="confirm" type="button" class="primary">Confirm</button>
      </div>
    </div>
  </dialog>
  <script type="module" src="/main.ts"></script>
</body>
</html>
